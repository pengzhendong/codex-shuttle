name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      quality: ${{ steps.matrix.outputs.quality }}
      remote: ${{ steps.matrix.outputs.remote }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: bash .github/scripts/platform-matrices.sh

  rust:
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.quality) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify native runner architecture
        shell: bash
        run: |
          test "$RUNNER_OS" = "${{ matrix.expected_os }}"
          test "$RUNNER_ARCH" = "${{ matrix.expected_arch }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: workspace-${{ runner.os }}-${{ runner.arch }}
          add-job-id-key: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        shell: bash
        run: bash .github/scripts/test-workspace.sh

  remote-e2e:
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.remote) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: remote-e2e-${{ runner.os }}-${{ runner.arch }}
          add-job-id-key: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/codex-shuttle-package
          key: codex-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/codex-versions.txt') }}
      - name: Exercise install, bridge, SSH, and doctor end to end
        shell: bash
        env:
          CXS_REMOTE_TARGET: ${{ matrix.target }}
          CXS_EXPECTED_KERNEL: ${{ matrix.kernel }}
          CXS_EXPECTED_UNAME_ARCHES: ${{ matrix.uname_arches }}
        run: |
          CODEX_VERSION=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | tail -n 1)
          export CODEX_VERSION
          export CXS_CI_CACHE_DIR="$RUNNER_TEMP/codex-shuttle-package"
          bash .github/scripts/test-remote-e2e.sh
