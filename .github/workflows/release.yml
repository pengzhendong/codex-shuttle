name: Release

on:
  schedule:
    # 00:17 UTC / 08:17 Asia/Shanghai
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      codex_version:
        description: "OpenAI Codex version, for example 0.148.0; empty selects the oldest unpublished stable version"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

concurrency:
  group: codex-shuttle-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      codex-version: ${{ steps.version.outputs.codex-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
      should-publish: ${{ steps.version.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          shuttle_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$shuttle_version"

          codex_version=${REQUESTED_CODEX_VERSION:-}
          if test -z "$codex_version" && test "$GITHUB_EVENT_NAME" = push; then
            case "$GITHUB_REF_NAME" in
              *-codex.*) codex_version=${GITHUB_REF_NAME##*-codex.} ;;
              *) codex_version=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | tail -n 1) ;;
            esac
          fi
          if test -z "$codex_version"; then
            baseline=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | head -n 1)
            test -n "$baseline"
            while read -r candidate; do
              test "$(printf '%s\n%s\n' "$baseline" "$candidate" | sort -V | head -n 1)" = "$baseline" || continue
              candidate_tag="v${shuttle_version}-codex.${candidate}"
              if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${candidate_tag}" >/dev/null 2>&1; then
                codex_version=$candidate
                break
              fi
            done < <(gh api --paginate repos/openai/codex/git/matching-refs/tags/rust-v \
              --jq '.[] | .ref | select(test("^refs/tags/rust-v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^refs/tags/rust-v"; "")' |
              sort -Vu)
          fi
          if test -z "$codex_version"; then
            echo "No unpublished stable Codex release was found."
            echo "codex-version=" >> "$GITHUB_OUTPUT"
            echo "release-tag=" >> "$GITHUB_OUTPUT"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$codex_version"
          printf '%s\n' "$codex_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          gh api "repos/openai/codex/git/ref/tags/rust-v${codex_version}" >/dev/null
          assets=$(gh api "repos/openai/codex/releases/tags/rust-v${codex_version}" --jq '.assets[].name')
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin; do
            printf '%s\n' "$assets" | grep -Fqx "codex-package-${target}.tar.gz"
          done
          printf '%s\n' "$assets" | grep -Fqx codex-package_SHA256SUMS

          if test "$GITHUB_EVENT_NAME" = push; then
            release_tag=$GITHUB_REF_NAME
          else
            release_tag="v${shuttle_version}-codex.${codex_version}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" >/dev/null 2>&1; then
            should_publish=false
          else
            should_publish=true
          fi
          echo "codex-version=$codex_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should-publish=$should_publish" >> "$GITHUB_OUTPUT"
  quality:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            expected-os: macOS
            expected-arch: ARM64
          - runner: ubuntu-24.04
            expected-os: Linux
            expected-arch: X64
          - runner: ubuntu-24.04-arm
            expected-os: Linux
            expected-arch: ARM64
          - runner: windows-2025
            expected-os: Windows
            expected-arch: X64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify native runner architecture
        shell: bash
        run: |
          test "$RUNNER_OS" = "${{ matrix.expected-os }}"
          test "$RUNNER_ARCH" = "${{ matrix.expected-arch }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: workspace-${{ runner.os }}-${{ runner.arch }}
          add-job-id-key: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  remote-e2e:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: release-e2e-${{ runner.os }}-${{ runner.arch }}
          add-job-id-key: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/codex-shuttle-package
          key: codex-package-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.codex-version }}
      - name: Exercise install, bridge, SSH, and doctor end to end
        shell: bash
        env:
          CODEX_VERSION: ${{ needs.prepare.outputs.codex-version }}
          CXS_CI_CACHE_DIR: ${{ runner.temp }}/codex-shuttle-package
        run: bash .github/scripts/test-remote-e2e.sh

  mac-cli:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: cxs-cli-macos-aarch64
          - target: x86_64-apple-darwin
            asset: cxs-cli-macos-x86_64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: mac-cli-${{ matrix.target }}
          add-job-id-key: false
      - run: cargo build --locked --release -p cxs-cli --target ${{ matrix.target }}
        env:
          CXS_RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
      - run: |
          mkdir -p release-staging
          cp target/${{ matrix.target }}/release/cxs release-staging/${{ matrix.asset }}
      - uses: actions/cache/save@v5
        with:
          path: release-staging/${{ matrix.asset }}
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.asset }}
          enableCrossOsArchive: true

  windows-cli:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: windows-cli-x86_64
          add-job-id-key: false
      - run: cargo build --locked --release -p cxs-cli
        env:
          CXS_RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-staging -Force | Out-Null
          Copy-Item target/release/cxs.exe release-staging/cxs-cli-windows-x86_64.exe
      - uses: actions/cache/save@v5
        with:
          path: release-staging/cxs-cli-windows-x86_64.exe
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-cli-windows-x86_64.exe
          enableCrossOsArchive: true

  linux-shim:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: cxs-shim-linux-x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            asset: cxs-shim-linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-zigbuild@0.23.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: linux-shim-${{ matrix.target }}
          add-job-id-key: false
      - run: cargo zigbuild --locked --release -p cxs-shim --target ${{ matrix.target }}
      - run: |
          mkdir -p release-staging
          cp target/${{ matrix.target }}/release/cxs-shim release-staging/${{ matrix.asset }}
      - uses: actions/cache/save@v5
        with:
          path: release-staging/${{ matrix.asset }}
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.asset }}
          enableCrossOsArchive: true

  macos-shim:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: macos-shim-aarch64
          add-job-id-key: false
      - run: cargo build --locked --release -p cxs-shim --target aarch64-apple-darwin
      - run: |
          mkdir -p release-staging
          cp target/aarch64-apple-darwin/release/cxs-shim release-staging/cxs-shim-macos-aarch64
      - uses: actions/cache/save@v5
        with:
          path: release-staging/cxs-shim-macos-aarch64
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-shim-macos-aarch64
          enableCrossOsArchive: true

  publish:
    needs: [prepare, quality, remote-e2e, mac-cli, windows-cli, linux-shim, macos-shim]
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: release-staging/cxs-cli-macos-aarch64
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-cli-macos-aarch64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release-staging/cxs-cli-macos-x86_64
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-cli-macos-x86_64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release-staging/cxs-cli-windows-x86_64.exe
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-cli-windows-x86_64.exe
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release-staging/cxs-shim-linux-aarch64
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-shim-linux-aarch64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release-staging/cxs-shim-linux-x86_64
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-shim-linux-x86_64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v5
        with:
          path: release-staging/cxs-shim-macos-aarch64
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-shim-macos-aarch64
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - run: (cd release-staging && sha256sum cxs-* > SHA256SUMS)
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release-tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Shuttle for Codex ${{ needs.prepare.outputs.codex-version }}
          body: |
            ## Downloads

            Most users only need the CLI for their desktop platform. `cxs install` automatically selects and installs the matching Linux or Apple Silicon macOS components.

            | macOS | Download | Purpose |
            | --- | --- | --- |
            | Apple Silicon (M1–M4) | [`cxs-cli-macos-aarch64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-cli-macos-aarch64) | Codex Shuttle CLI |
            | Intel | [`cxs-cli-macos-x86_64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-cli-macos-x86_64) | Codex Shuttle CLI |

            | Windows | Download | Purpose |
            | --- | --- | --- |
            | x86_64 | [`cxs-cli-windows-x86_64.exe`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-cli-windows-x86_64.exe) | Codex Shuttle CLI |

            ## Installer components

            The shim is downloaded automatically. The matching official Codex package is downloaded directly from [OpenAI Codex Releases](https://github.com/openai/codex/releases).

            | File | Purpose |
            | --- | --- |
            | [`cxs-shim-linux-aarch64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-shim-linux-aarch64) | SSH/Yamux shim for ARM64 Linux hosts |
            | [`cxs-shim-linux-x86_64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-shim-linux-x86_64) | SSH/Yamux shim for x86_64 Linux hosts |
            | [`cxs-shim-macos-aarch64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-shim-macos-aarch64) | SSH/Yamux shim for Apple Silicon macOS hosts |
            | [`SHA256SUMS`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/SHA256SUMS) | SHA-256 checksums for every release asset |

            See the [installation guide](https://github.com/${{ github.repository }}#installation) for the recommended setup.
          generate_release_notes: true
          files: |
            release-staging/cxs-cli-*
            release-staging/cxs-shim-*
            release-staging/SHA256SUMS
      - name: Delete published staging caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache_prefix="cxs-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .key] | @tsv' |
          while IFS=$'\t' read -r cache_id cache_key; do
            test -n "$cache_id" || continue
            case "$cache_key" in
              "$cache_prefix"*) ;;
              *) continue ;;
            esac
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
          done
