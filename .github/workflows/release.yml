name: Release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      codex_version:
        description: "OpenAI Codex version, for example 0.148.0; empty selects the oldest unpublished stable version"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

concurrency:
  group: codex-shuttle-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      codex-version: ${{ steps.version.outputs.codex-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
      runtime-release-tag: ${{ steps.runtime.outputs.release-tag }}
      should-publish: ${{ steps.version.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          shuttle_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$shuttle_version"

          codex_version=${REQUESTED_CODEX_VERSION:-}
          if test -z "$codex_version" && test "$GITHUB_EVENT_NAME" = push; then
            case "$GITHUB_REF_NAME" in
              *-codex.*) codex_version=${GITHUB_REF_NAME##*-codex.} ;;
              *) codex_version=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | tail -n 1) ;;
            esac
          fi
          if test -z "$codex_version"; then
            baseline=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | head -n 1)
            test -n "$baseline"
            while read -r candidate; do
              test "$(printf '%s\n%s\n' "$baseline" "$candidate" | sort -V | head -n 1)" = "$baseline" || continue
              candidate_tag="v${shuttle_version}-codex.${candidate}"
              if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${candidate_tag}" >/dev/null 2>&1; then
                codex_version=$candidate
                break
              fi
            done < <(gh api --paginate repos/openai/codex/git/matching-refs/tags/rust-v \
              --jq '.[] | .ref | select(test("^refs/tags/rust-v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^refs/tags/rust-v"; "")' |
              sort -Vu)
          fi
          if test -z "$codex_version"; then
            echo "No unpublished stable Codex release was found."
            echo "codex-version=" >> "$GITHUB_OUTPUT"
            echo "release-tag=" >> "$GITHUB_OUTPUT"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$codex_version"
          printf '%s\n' "$codex_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          gh api "repos/openai/codex/git/ref/tags/rust-v${codex_version}" >/dev/null

          if test "$GITHUB_EVENT_NAME" = push; then
            release_tag=$GITHUB_REF_NAME
          else
            release_tag="v${shuttle_version}-codex.${codex_version}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" >/dev/null 2>&1; then
            should_publish=false
          else
            should_publish=true
          fi
          echo "codex-version=$codex_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should-publish=$should_publish" >> "$GITHUB_OUTPUT"
      - id: runtime
        if: steps.version.outputs.should-publish == 'true'
        env:
          CODEX_VERSION: ${{ steps.version.outputs.codex-version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release-tag }}
        run: |
          set -euo pipefail
          runtime_release_tag=
          suffix="-codex.${CODEX_VERSION}"
          while read -r candidate; do
            test -n "$candidate" || continue
            test "$candidate" != "$RELEASE_TAG" || continue
            case "$candidate" in
              *"$suffix") ;;
              *) continue ;;
            esac

            git fetch --no-tags origin "refs/tags/${candidate}:refs/tags/${candidate}"
            if ! git diff --quiet "$candidate" "$GITHUB_SHA" -- \
              runtime/cxs-runtime \
              scripts/build-cxs-runtime.sh \
              .github/workflows/runtime.yml; then
              echo "Runtime inputs differ from $candidate; skipping it."
              continue
            fi

            candidate_dir=$(mktemp -d)
            valid=true
            if ! gh release download "$candidate" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'cxs-runtime-*.tar.gz' \
              --pattern SHA256SUMS \
              --dir "$candidate_dir"; then
              valid=false
            fi
            if test "$valid" = true; then
              for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
                case "$target" in
                  x86_64-*) arch=x86_64 ;;
                  aarch64-*) arch=aarch64 ;;
                esac
                name="cxs-runtime-linux-${arch}-codex-${CODEX_VERSION}.tar.gz"
                if ! test -f "$candidate_dir/$name"; then
                  name="cxs-runtime-codex-${CODEX_VERSION}-${target}.tar.gz"
                fi
                awk -v name="$name" '$2 == name' "$candidate_dir/SHA256SUMS" > "$candidate_dir/runtime.sha256"
                if ! test -s "$candidate_dir/runtime.sha256" ||
                  ! (cd "$candidate_dir" && sha256sum --check runtime.sha256); then
                  valid=false
                  break
                fi
              done
            fi
            rm -rf "$candidate_dir"

            if test "$valid" = true; then
              runtime_release_tag=$candidate
              echo "Reusing verified runtime assets from $candidate."
              break
            fi
            echo "$candidate has no complete, valid runtime; trying the next Release."
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')

          if test -z "$runtime_release_tag"; then
            echo "No compatible verified runtime Release was found; the runtime will be built."
          fi
          echo "release-tag=$runtime_release_tag" >> "$GITHUB_OUTPUT"
      - name: Create artifact storage probe
        if: steps.version.outputs.should-publish == 'true'
        run: printf 'release artifact storage is available\n' > release-storage-probe.txt
      - name: Verify artifact storage capacity
        if: steps.version.outputs.should-publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-storage-probe
          path: release-storage-probe.txt
          retention-days: 1
          compression-level: 0

  quality:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: workspace-${{ runner.os }}-${{ runner.arch }}
          add-job-id-key: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  mac-cli:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: cxs-cli-macos-aarch64
          - target: x86_64-apple-darwin
            asset: cxs-cli-macos-x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: mac-cli-${{ matrix.target }}
          add-job-id-key: false
      - run: cargo build --locked --release -p cxs-cli --target ${{ matrix.target }}
        env:
          CXS_RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
      - run: cp target/${{ matrix.target }}/release/cxs ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

  linux-shim:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: cxs-shim-linux-x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            asset: cxs-shim-linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-zigbuild@0.22.3
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: linux-shim-${{ matrix.target }}
          add-job-id-key: false
      - run: cargo zigbuild --locked --release -p cxs-shim --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/cxs-shim ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

  linux-runtime:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    uses: ./.github/workflows/runtime.yml
    with:
      codex_version: ${{ needs.prepare.outputs.codex-version }}
      reuse_release_tag: ${{ needs.prepare.outputs.runtime-release-tag }}

  publish:
    needs: [prepare, quality, mac-cli, linux-shim, linux-runtime]
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cxs-*
          merge-multiple: true
      - run: sha256sum cxs-* > SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release-tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Shuttle for Codex ${{ needs.prepare.outputs.codex-version }}
          body: |
            ## Downloads

            Most users only need the CLI for their Mac. `cxs install` automatically selects and installs the matching Linux components.

            | macOS | Download | Purpose |
            | --- | --- | --- |
            | Apple Silicon (M1–M4) | [`cxs-cli-macos-aarch64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-cli-macos-aarch64) | Codex Shuttle CLI |
            | Intel | [`cxs-cli-macos-x86_64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-cli-macos-x86_64) | Codex Shuttle CLI |

            ## Installer components

            These files are normally downloaded automatically; they are listed here for offline and manual installation.

            | File | Purpose |
            | --- | --- |
            | [`cxs-runtime-linux-aarch64-codex-${{ needs.prepare.outputs.codex-version }}.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-runtime-linux-aarch64-codex-${{ needs.prepare.outputs.codex-version }}.tar.gz) | Codex runtime for ARM64 Linux hosts |
            | [`cxs-runtime-linux-x86_64-codex-${{ needs.prepare.outputs.codex-version }}.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-runtime-linux-x86_64-codex-${{ needs.prepare.outputs.codex-version }}.tar.gz) | Codex runtime for x86_64 Linux hosts |
            | [`cxs-shim-linux-aarch64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-shim-linux-aarch64) | SSH/Yamux shim for ARM64 Linux hosts |
            | [`cxs-shim-linux-x86_64`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/cxs-shim-linux-x86_64) | SSH/Yamux shim for x86_64 Linux hosts |
            | [`SHA256SUMS`](https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release-tag }}/SHA256SUMS) | SHA-256 checksums for every release asset |

            See the [installation guide](https://github.com/${{ github.repository }}#installation) for the recommended setup.
          generate_release_notes: true
          files: |
            cxs-cli-*
            cxs-runtime-*
            cxs-shim-*
            SHA256SUMS
      - name: Delete published staging artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r artifact_id; do
            test -n "$artifact_id" || continue
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
