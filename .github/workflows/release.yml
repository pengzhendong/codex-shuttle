name: Release

on:
  schedule:
    # 00:17 UTC / 08:17 Asia/Shanghai
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      codex_version:
        description: "OpenAI Codex version, for example 0.148.0; empty selects the oldest unpublished stable version"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

concurrency:
  group: codex-shuttle-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      codex-version: ${{ steps.version.outputs.codex-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
      should-publish: ${{ steps.version.outputs.should-publish }}
      quality-matrix: ${{ steps.matrix.outputs.quality }}
      remote-matrix: ${{ steps.matrix.outputs.remote }}
      cli-matrix: ${{ steps.matrix.outputs.cli }}
      shim-matrix: ${{ steps.matrix.outputs.shim }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: bash .github/scripts/platform-matrices.sh
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          shuttle_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$shuttle_version"

          codex_version=${REQUESTED_CODEX_VERSION:-}
          if test -z "$codex_version" && test "$GITHUB_EVENT_NAME" = push; then
            case "$GITHUB_REF_NAME" in
              *-codex.*) codex_version=${GITHUB_REF_NAME##*-codex.} ;;
              *) codex_version=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | tail -n 1) ;;
            esac
          fi
          if test -z "$codex_version"; then
            baseline=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | head -n 1)
            test -n "$baseline"
            while read -r candidate; do
              test "$(printf '%s\n%s\n' "$baseline" "$candidate" | sort -V | head -n 1)" = "$baseline" || continue
              candidate_tag="v${shuttle_version}-codex.${candidate}"
              if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${candidate_tag}" >/dev/null 2>&1; then
                codex_version=$candidate
                break
              fi
            done < <(gh api --paginate repos/openai/codex/git/matching-refs/tags/rust-v \
              --jq '.[] | .ref | select(test("^refs/tags/rust-v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^refs/tags/rust-v"; "")' |
              sort -Vu)
          fi
          if test -z "$codex_version"; then
            echo "No unpublished stable Codex release was found."
            echo "codex-version=" >> "$GITHUB_OUTPUT"
            echo "release-tag=" >> "$GITHUB_OUTPUT"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$codex_version"
          printf '%s\n' "$codex_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          gh api "repos/openai/codex/git/ref/tags/rust-v${codex_version}" >/dev/null
          assets=$(gh api "repos/openai/codex/releases/tags/rust-v${codex_version}" --jq '.assets[].name')
          while read -r target; do
            printf '%s\n' "$assets" | grep -Fqx "codex-package-${target}.tar.gz"
          done < <(jq -r '.platforms[] | select(.remote) | .rust_target' runtime/platforms.json)
          printf '%s\n' "$assets" | grep -Fqx codex-package_SHA256SUMS

          if test "$GITHUB_EVENT_NAME" = push; then
            release_tag=$GITHUB_REF_NAME
          else
            release_tag="v${shuttle_version}-codex.${codex_version}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" >/dev/null 2>&1; then
            should_publish=false
          else
            should_publish=true
          fi
          echo "codex-version=$codex_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should-publish=$should_publish" >> "$GITHUB_OUTPUT"
  quality:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.quality-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify native runner architecture
        shell: bash
        run: |
          test "$RUNNER_OS" = "${{ matrix.expected_os }}"
          test "$RUNNER_ARCH" = "${{ matrix.expected_arch }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: workspace-${{ runner.os }}-${{ runner.arch }}
          add-job-id-key: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        shell: bash
        run: bash .github/scripts/test-workspace.sh

  remote-e2e:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.remote-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: release-e2e-${{ runner.os }}-${{ runner.arch }}
          add-job-id-key: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/codex-shuttle-package
          key: codex-package-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.codex-version }}
      - name: Exercise install, bridge, SSH, and doctor end to end
        shell: bash
        env:
          CODEX_VERSION: ${{ needs.prepare.outputs.codex-version }}
          CXS_CI_CACHE_DIR: ${{ runner.temp }}/codex-shuttle-package
          CXS_REMOTE_TARGET: ${{ matrix.target }}
          CXS_EXPECTED_KERNEL: ${{ matrix.kernel }}
          CXS_EXPECTED_UNAME_ARCHES: ${{ matrix.uname_arches }}
        run: bash .github/scripts/test-remote-e2e.sh

  cli:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.cli-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: mac-cli-${{ matrix.target }}
          add-job-id-key: false
      - shell: bash
        run: cargo build --locked --release -p cxs-cli --target ${{ matrix.target }}
        env:
          CXS_RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
      - shell: bash
        run: |
          mkdir -p release-staging
          cp target/${{ matrix.target }}/release/${{ matrix.source }} release-staging/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: release-staging/${{ matrix.asset }}

  shim:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.shim-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2.2.1
        if: matrix.builder == 'zig'
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2.87.1
        if: matrix.builder == 'zig'
        with:
          tool: cargo-zigbuild@0.23.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: shim-${{ matrix.target }}
          add-job-id-key: false
      - if: matrix.builder == 'zig'
        run: cargo zigbuild --locked --release -p cxs-shim --target ${{ matrix.target }}
      - if: matrix.builder == 'cargo'
        run: cargo build --locked --release -p cxs-shim --target ${{ matrix.target }}
      - run: |
          mkdir -p release-staging
          cp target/${{ matrix.target }}/release/cxs-shim release-staging/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: release-staging/${{ matrix.asset }}

  publish:
    needs: [prepare, quality, remote-e2e, cli, shim]
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-staging
          merge-multiple: true
      - run: (cd release-staging && sha256sum cxs-* > SHA256SUMS)
      - name: Render release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: |
          {
            echo '## Downloads'
            echo
            echo 'Most users only need the CLI for their desktop platform. `cxs install` automatically selects and installs the matching Linux or macOS components.'
            echo
            echo '| Platform | Download | Purpose |'
            echo '| --- | --- | --- |'
            jq -r '.platforms[] | select(.cli_asset != null) | [.runner_os, .runner_arch, .cli_asset] | @tsv' runtime/platforms.json |
            while IFS=$'\t' read -r platform arch asset; do
              printf '| %s %s | [`%s`](https://github.com/%s/releases/download/%s/%s) | Codex Shuttle CLI |\n' "$platform" "$arch" "$asset" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$asset"
            done
            echo
            echo '## Installer components'
            echo
            echo 'The shim is downloaded automatically. The matching official Codex package is downloaded directly from [OpenAI Codex Releases](https://github.com/openai/codex/releases).'
            echo
            echo '| Platform | File | Purpose |'
            echo '| --- | --- | --- |'
            jq -r '.platforms[] | select(.remote) | [.runner_os, .runner_arch, .shim_asset] | @tsv' runtime/platforms.json |
            while IFS=$'\t' read -r platform arch asset; do
              printf '| %s %s | [`%s`](https://github.com/%s/releases/download/%s/%s) | SSH/Yamux remote shim |\n' "$platform" "$arch" "$asset" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$asset"
            done
            printf '| All | [`SHA256SUMS`](https://github.com/%s/releases/download/%s/SHA256SUMS) | SHA-256 checksums for every release asset |\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            echo
            echo 'See the [installation guide](https://github.com/'"$GITHUB_REPOSITORY"'#installation) for the recommended setup.'
          } > release-notes.md
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release-tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Shuttle for Codex ${{ needs.prepare.outputs.codex-version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-staging/cxs-cli-*
            release-staging/cxs-shim-*
            release-staging/SHA256SUMS
