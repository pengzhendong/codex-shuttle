name: Runtime Build

on:
  workflow_call:
    inputs:
      codex_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      codex_version:
        description: "OpenAI Codex version, for example 0.147.0"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-zigbuild@0.22.3
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Build runtime package
        env:
          CXS_RUNTIME_CARGO: cargo-zigbuild
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ runner.temp }}
          SCCACHE_GHA_ENABLED: "true"
        run: scripts/build-cxs-runtime.sh "${{ inputs.codex_version }}" "${{ matrix.target }}" runtime-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: cxs-runtime-codex-${{ inputs.codex_version }}-${{ matrix.target }}
          path: runtime-artifacts/*.tar.gz
      - name: Smoke-test runtime package
        run: |
          mkdir runtime-smoke
          tar -xzf runtime-artifacts/cxs-runtime-codex-${{ inputs.codex_version }}-${{ matrix.target }}.tar.gz -C runtime-smoke
          test "$(runtime-smoke/bin/cxs-runtime --version)" = "codex-cli ${{ inputs.codex_version }}"
          runtime-smoke/bin/cxs-runtime exec-server --help >/dev/null
          runtime-smoke/codex-path/rg --version >/dev/null
          runtime-smoke/codex-resources/bwrap --help >/dev/null
