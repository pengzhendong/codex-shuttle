name: Release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      codex_version:
        description: "OpenAI Codex version, for example 0.148.0; empty selects the oldest unpublished stable version"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: codex-shuttle-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      codex-version: ${{ steps.version.outputs.codex-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
      should-publish: ${{ steps.version.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          shuttle_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$shuttle_version"

          codex_version=${REQUESTED_CODEX_VERSION:-}
          if test -z "$codex_version" && test "$GITHUB_EVENT_NAME" = push; then
            case "$GITHUB_REF_NAME" in
              *-codex.*) codex_version=${GITHUB_REF_NAME##*-codex.} ;;
              *) codex_version=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | tail -n 1) ;;
            esac
          fi
          if test -z "$codex_version"; then
            baseline=$(sed -n '/^[0-9][0-9.]*$/p' runtime/codex-versions.txt | head -n 1)
            test -n "$baseline"
            while read -r candidate; do
              test "$(printf '%s\n%s\n' "$baseline" "$candidate" | sort -V | head -n 1)" = "$baseline" || continue
              candidate_tag="v${shuttle_version}-codex.${candidate}"
              if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${candidate_tag}" >/dev/null 2>&1; then
                codex_version=$candidate
                break
              fi
            done < <(gh api --paginate repos/openai/codex/git/matching-refs/tags/rust-v \
              --jq '.[] | .ref | select(test("^refs/tags/rust-v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^refs/tags/rust-v"; "")' |
              sort -Vu)
          fi
          if test -z "$codex_version"; then
            echo "No unpublished stable Codex release was found."
            echo "codex-version=" >> "$GITHUB_OUTPUT"
            echo "release-tag=" >> "$GITHUB_OUTPUT"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$codex_version"
          printf '%s\n' "$codex_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          gh api "repos/openai/codex/git/ref/tags/rust-v${codex_version}" >/dev/null

          if test "$GITHUB_EVENT_NAME" = push; then
            release_tag=$GITHUB_REF_NAME
          else
            release_tag="v${shuttle_version}-codex.${codex_version}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" >/dev/null 2>&1; then
            should_publish=false
          else
            should_publish=true
          fi
          echo "codex-version=$codex_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should-publish=$should_publish" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  mac-cli:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release -p cxs-cli --target ${{ matrix.target }}
        env:
          CXS_RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
      - run: cp target/${{ matrix.target }}/release/cxs cxs-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cxs-${{ matrix.target }}
          path: cxs-${{ matrix.target }}

  linux-shim:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --locked --release -p cxs-shim --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/cxs-shim cxs-shim-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cxs-shim-${{ matrix.target }}
          path: cxs-shim-${{ matrix.target }}

  linux-runtime:
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
      - uses: docker/setup-qemu-action@v4
      - run: cargo install cargo-zigbuild --locked
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/cxs-runtime-target-${{ matrix.target }}
          key: cxs-runtime-${{ runner.os }}-${{ matrix.target }}-${{ needs.prepare.outputs.codex-version }}-${{ hashFiles('runtime/cxs-runtime/**', 'scripts/build-cxs-runtime.sh') }}
          restore-keys: |
            cxs-runtime-${{ runner.os }}-${{ matrix.target }}-${{ needs.prepare.outputs.codex-version }}-
            cxs-runtime-${{ runner.os }}-${{ matrix.target }}-
      - run: CXS_RUNTIME_CARGO=cargo-zigbuild scripts/build-cxs-runtime.sh "${{ needs.prepare.outputs.codex-version }}" "${{ matrix.target }}" runtime-artifacts
      - name: Smoke-test runtime package
        run: |
          mkdir runtime-smoke
          tar -xzf runtime-artifacts/cxs-runtime-codex-${{ needs.prepare.outputs.codex-version }}-${{ matrix.target }}.tar.gz -C runtime-smoke
          test "$(runtime-smoke/bin/cxs-runtime --version)" = "codex-cli ${{ needs.prepare.outputs.codex-version }}"
          runtime-smoke/bin/cxs-runtime exec-server --help >/dev/null
          runtime-smoke/codex-path/rg --version >/dev/null
          runtime-smoke/codex-resources/bwrap --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cxs-runtime-codex-${{ needs.prepare.outputs.codex-version }}-${{ matrix.target }}
          path: runtime-artifacts/*.tar.gz

  publish:
    needs: [prepare, quality, mac-cli, linux-shim, linux-runtime]
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cxs-*
          merge-multiple: true
      - run: sha256sum cxs-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release-tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Shuttle for Codex ${{ needs.prepare.outputs.codex-version }}
          generate_release_notes: true
          files: |
            cxs-*
            SHA256SUMS
