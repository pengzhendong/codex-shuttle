name: Runtime Build

on:
  workflow_call:
    inputs:
      codex_version:
        required: true
        type: string
      reuse_release_tag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      codex_version:
        description: "OpenAI Codex version, for example 0.147.0"
        required: true
        type: string
      reuse_release_tag:
        description: "Existing Shuttle release whose matching runtime assets should be reused"
        required: false
        type: string

permissions:
  actions: write
  contents: read

env:
  REUSE_RELEASE_TAG: ${{ inputs.reuse_release_tag || github.event.inputs.reuse_release_tag || '' }}

jobs:
  reuse:
    if: (inputs.reuse_release_tag || github.event.inputs.reuse_release_tag || '') != ''
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ubuntu-24.04
    steps:
      - name: Download previous runtime package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.REUSE_RELEASE_TAG }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            x86_64-*) arch=x86_64 ;;
            aarch64-*) arch=aarch64 ;;
          esac
          runtime_name="cxs-runtime-linux-${arch}-codex-${CODEX_VERSION}.tar.gz"
          legacy_name="cxs-runtime-codex-${CODEX_VERSION}-${TARGET}.tar.gz"
          mkdir runtime-artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir runtime-artifacts
          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$runtime_name" --dir runtime-artifacts; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$legacy_name" --dir runtime-artifacts
            downloaded_name=$legacy_name
          else
            downloaded_name=$runtime_name
          fi
          awk -v name="$downloaded_name" '$2 == name' runtime-artifacts/SHA256SUMS > runtime-artifacts/runtime.sha256
          test -s runtime-artifacts/runtime.sha256
          (cd runtime-artifacts && sha256sum --check runtime.sha256)
          if test "$downloaded_name" != "$runtime_name"; then
            mv "runtime-artifacts/$downloaded_name" "runtime-artifacts/$runtime_name"
          fi
          mkdir -p release-staging
          cp "runtime-artifacts/$runtime_name" "release-staging/$runtime_name"
      - uses: actions/cache/save@v5
        with:
          path: release-staging/cxs-runtime-linux-${{ matrix.arch }}-codex-${{ inputs.codex_version }}.tar.gz
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-runtime-linux-${{ matrix.arch }}-codex-${{ inputs.codex_version }}.tar.gz
          enableCrossOsArchive: true

  runtime:
    if: (inputs.reuse_release_tag || github.event.inputs.reuse_release_tag || '') == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-zigbuild@0.22.3
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cxs-runtime-deps-v1-${{ matrix.target }}-${{ hashFiles('runtime/cxs-runtime/Cargo.toml') }}
      - name: Build runtime package
        env:
          CXS_RUNTIME_CARGO: cargo-zigbuild
        run: scripts/build-cxs-runtime.sh "${{ inputs.codex_version }}" "${{ matrix.target }}" runtime-artifacts
      - name: Smoke-test runtime package
        run: |
          case "${{ matrix.target }}" in
            x86_64-*) arch=x86_64 ;;
            aarch64-*) arch=aarch64 ;;
          esac
          mkdir runtime-smoke
          tar -xzf runtime-artifacts/cxs-runtime-linux-${arch}-codex-${{ inputs.codex_version }}.tar.gz -C runtime-smoke
          test "$(runtime-smoke/bin/cxs-runtime --version)" = "codex-cli ${{ inputs.codex_version }}"
          runtime-smoke/bin/cxs-runtime exec-server --help >/dev/null
          runtime-smoke/codex-path/rg --version >/dev/null
          runtime-smoke/codex-resources/bwrap --help >/dev/null
      - name: Stage runtime package
        run: |
          mkdir -p release-staging
          cp runtime-artifacts/cxs-runtime-linux-${{ matrix.arch }}-codex-${{ inputs.codex_version }}.tar.gz release-staging/
      - uses: actions/cache/save@v5
        with:
          path: release-staging/cxs-runtime-linux-${{ matrix.arch }}-codex-${{ inputs.codex_version }}.tar.gz
          key: cxs-release-${{ github.run_id }}-${{ github.run_attempt }}-cxs-runtime-linux-${{ matrix.arch }}-codex-${{ inputs.codex_version }}.tar.gz
          enableCrossOsArchive: true
