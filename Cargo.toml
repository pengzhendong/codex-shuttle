[workspace]
members = [
    "crates/cxs-bridge",
    "crates/cxs-cli",
    "crates/cxs-core",
    "crates/cxs-install",
    "crates/cxs-mux",
    "crates/cxs-probe",
    "crates/cxs-sessions",
    "crates/cxs-shim",
    "crates/cxs-ssh",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pengzhendong/codex-shuttle"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
getrandom = "0.4"
hex = "0.4"
futures-util = "0.3"
fs4 = "0.13"
libc = "0.2"
nix = { version = "0.31", features = ["process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
rusqlite = { version = "0.40", features = ["backup"] }
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
tokio = { version = "1.47", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
yamux = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
